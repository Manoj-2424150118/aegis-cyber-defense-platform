[project]
name = "aegis-backend"
version = "1.1.0"
description = "Aegis — Personal Cyber Defense Platform (API)"
requires-python = ">=3.12"

# Lint rules are pinned explicitly so a ruff upgrade can never silently
# change what CI enforces. B008 is the standard FastAPI Depends() idiom.
[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
