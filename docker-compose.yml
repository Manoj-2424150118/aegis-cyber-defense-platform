services:
  backend:
    build: ./backend
    environment:
      # Override in production! See backend/.env.example
      AEGIS_SECRET_KEY: ${AEGIS_SECRET_KEY:-dev-only-change-me-in-production-please-32chars}
      AEGIS_DATABASE_URL: sqlite:///./data/aegis.db
    volumes:
      - aegis-data:/app/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  aegis-data:
